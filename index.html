<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amart — Haviligi</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="brand"><b>A</b><strong>Amart</strong><small>Haviligi</small></div><a href="/owner.html">Owner</a></header>
<section class="hero"><div><small>AMART • HAVILIGI</small><h1>Groceries delivered to your doorstep.</h1><p>Shop your everyday essentials from your local store.</p><div class="search">⌕ <input id="q" placeholder="Search rice, milk, soap..."></div></div></section>
<main><div class="row"><h2>Categories</h2></div><div id="cats" class="cats"></div><div class="row"><h2>Products</h2><span id="count"></span></div><div id="products" class="grid"></div></main>
<button id="cartBtn" class="cart">🛒 Cart <b id="num">0</b></button>
<div id="cart" class="overlay hide"><div class="sheet"><button class="x" onclick="closeCart()">×</button><h2>Your cart</h2><div id="cartItems"></div><div class="total"><b>Total</b><strong id="total">₹0</strong></div><button class="primary" onclick="checkout()">Cash on Delivery — Checkout</button></div></div>
<div id="checkout" class="overlay hide"><div class="sheet"><button class="x" onclick="closeCheckout()">×</button><h2>Delivery details</h2><p class="muted">Payment: Cash on Delivery</p><form id="form"><label>Name<input name="name" required></label><label>Mobile<input name="phone" required inputmode="tel"></label><label>Address<textarea name="address" required placeholder="House number, street, Haviligi"></textarea></label><label>Notes<textarea name="notes"></textarea></label><button class="primary">Place order</button></form></div></div>
<div id="done" class="overlay hide"><div class="sheet center"><h2>Order placed 🎉</h2><p id="orderMsg"></p><button class="primary" onclick="location.reload()">Continue shopping</button></div></div>
<script src="/app.js"></script></body></html>
