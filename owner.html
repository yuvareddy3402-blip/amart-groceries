<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amart Owner Dashboard</title><link rel="stylesheet" href="styles.css">
</head>
<body class="owner-page">
<header class="topbar">
 <div class="brand"><span class="brand-mark">A</span><div><b>Amart</b><small>Owner Dashboard</small></div></div>
 <a class="owner-link" href="index.html">Storefront</a>
</header>
<main class="owner-main">
 <div class="owner-title"><div><p class="eyebrow">OWNER PANEL</p><h1>Good day 👋</h1><p class="muted">Manage orders, products and your local store.</p></div></div>
 <section class="stats">
   <div><span>New orders</span><strong id="newOrders">0</strong></div>
   <div><span>Today's orders</span><strong id="todayOrders">0</strong></div>
   <div><span>Today's sales</span><strong id="todaySales">₹0</strong></div>
   <div><span>Products</span><strong id="productTotal">0</strong></div>
 </section>
 <section class="owner-section">
  <div class="section-head"><h2>Incoming orders</h2><button class="small-btn" onclick="clearDemoOrders()">Clear demo orders</button></div>
  <div id="orders" class="orders"></div>
 </section>
 <section class="owner-section">
  <div class="section-head"><h2>Products</h2><button class="small-btn" onclick="addProduct()">+ Add product</button></div>
  <div class="product-table" id="productTable"></div>
 </section>
 <section class="owner-section settings">
   <h2>Store settings</h2>
   <div class="setting"><div><b>Store name</b><span>Shown to customers</span></div><input id="storeName" value="Amart"></div>
   <div class="setting"><div><b>Location</b><span>Delivery area</span></div><input id="storeLocation" value="Haviligi"></div>
   <div class="setting"><div><b>Order phone</b><span>Add your number later</span></div><input id="storePhone" placeholder="Enter phone number"></div>
   <button class="primary" onclick="saveSettings()">Save settings</button>
 </section>
</main>
<script src="app.js"></script>
<script>
renderOwner();
</script>
</body>
</html>
